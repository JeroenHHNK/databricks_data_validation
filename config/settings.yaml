# Dashboard + pipeline configuration.
#
# NOTE: the on-prem `dashboard/config.py` loads this file and applies its own
# defaults. The keys below are the ones this Databricks-backed pipeline adds or
# relies on; when you vendor in the on-prem `config/settings.yaml`, merge its
# keys into this file rather than overwriting it.

# --- Data pulled from the Databricks source (written by 02_export_to_git) ---
# Everything replicated from Databricks lives under output_databricks/. Replaces
# the old input_data/ + convert-fugro/convert-wiertsema flow; git carries it, the
# local IDE pulls it.
#   output_databricks/time_series_data/<series>.csv   (Time,head)
#   output_databricks/metadata/object_data.csv        (one row per series; join on `filename`)
databricks_output_dir: output_databricks
time_series_dir: output_databricks/time_series_data
metadata_file: output_databricks/metadata/object_data.csv

# --- Local validation output (written back to Delta by 03_validated_to_delta) ---
# The validation tooling reads output_databricks/ and writes the reviewed copies
# here; 03 reads these and builds the validated Delta table. Frozen store schema.
repository_output_dir: output_repository

# --- Ephemeral build artifacts (gitignored) ---
output_data_dir: output_data

# --- KNMI forcing committed to the repo (cluster has no egress) ---
forcing_dir: data/forcing
forcing_station: 249

# --- Validation store ---
# FROZEN. Do not change: breaks merge compatibility with existing review work.
store:
  frequency: "1h"
  schema: [timestamp, raw_data, gecontroleerd, afgekeurd, note]

# --- Automated flag thresholds (v2/v3/v4), carried from the handover §5 ---
flags:
  v2_max_up: 0.30 # m/h
  v2_max_down: -0.05 # m/h
  v3_band: 0.15 # m above hmin
  v3_min_run: 96 # steps
  v4_iqr_factor: 1.5
